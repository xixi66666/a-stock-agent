spring:
  application:
    name: a-stock-agent
  config:
    import: optional:file:./config/application-local.yml
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  market-data:
    connect-timeout: 3s
    request-timeout: 8s
    eastmoney-min-interval: 1s
    eastmoney-jitter: 400ms
    provider-cooldown: 30m
    max-retries: 2
