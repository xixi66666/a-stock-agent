spring:
  application:
    name: a-stock-agent
  config:
    import: optional:file:./config/application-local.yml
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    mcp:
      server:
        enabled: false

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration

server:
  port: 10001

# 单独开启交互/请求/任务日志，避免为了排查而开启全局 DEBUG。
logging:
  level:
    com.astock.agent.observability: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai:
    # 生产环境中的命名模型由 config/application-local.yml 提供；默认保持离线可启动。
    models: {}
    roles:
      finrobot-research: deepseek
      institutional-report: primary
      financial-report: deepseek
      cycle-report: deepseek
      uzi-research: deepseek
  agent:
    learning:
      enabled: false
      memory-enabled: true
      advisor-enabled: true
      rag-enabled: true
      mcp-enabled: true
      max-history-messages: 24
      top-k: 4
      embedding-dimension: 128
  uzi:
    root-path: tools/uzi/UZI-Skill
    report-path: data/uzi-reports
    task-timeout: 30m
    max-concurrent-tasks: 1
  market-data:
    connect-timeout: 3s
    request-timeout: 8s
    eastmoney-min-interval: 1s
    eastmoney-jitter: 400ms
    provider-cooldown: 30m
    max-retries: 2
