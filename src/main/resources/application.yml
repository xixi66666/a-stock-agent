spring:
  application:
    name: a-stock-agent
  config:
    import: optional:file:./config/application-local.yml
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration

server:
  port: 10001

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  agent:
    learning:
      enabled: false
      memory-enabled: true
      advisor-enabled: true
      rag-enabled: true
      mcp-enabled: true
      max-history-messages: 24
      top-k: 4
      embedding-dimension: 128
  market-data:
    connect-timeout: 3s
    request-timeout: 8s
    eastmoney-min-interval: 1s
    eastmoney-jitter: 400ms
    provider-cooldown: 30m
    max-retries: 2
